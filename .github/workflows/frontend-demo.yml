name: Recovered frontend demo CI

on:
  push:
    branches:
      - 'recovery/**'
  pull_request:
    paths:
      - 'packages/codex-frontend-reconstruction/**'
      - '.github/workflows/frontend-demo.yml'

jobs:
  core-and-browser-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/codex-frontend-reconstruction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install demo dependencies
        run: npm install --no-audit --no-fund
      - name: Core reconstruction tests
        run: npm run test:core
      - name: Demo data-model integration tests
        run: npm run demo:check-model
      - name: Type-check and bundle React preview
        run: npm run demo:build
      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run demo:test:e2e
      - name: Electron desktop frontend smoke (Linux Xvfb)
        run: xvfb-run -a timeout 90s npm run desktop:smoke
        env:
          AGENT_WEB_SMOKE_SCREENSHOT: demo/test-results/electron-desktop-smoke.png
      - name: Upload browser preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-style-demo-browser-preview
          path: packages/codex-frontend-reconstruction/demo/test-results/
          if-no-files-found: warn
