name: Recovered frontend demo CI

on:
  push:
    branches:
      - 'main'
      - 'recovery/**'
  pull_request:
    paths:
      - 'packages/codex-frontend-reconstruction/**'
      - '.github/workflows/frontend-demo.yml'

# Recovery branch commits are frequent. Do not spend desktop CI resources
# validating superseded heads; a fresh push rechecks every required gate.
concurrency:
  group: frontend-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-browser-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/codex-frontend-reconstruction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install demo dependencies
        run: npm install --no-audit --no-fund
      - name: Core reconstruction tests
        run: npm run test:core
      - name: Demo data-model integration tests
        run: npm run demo:check-model
      - name: Type-check and bundle React preview
        run: npm run demo:build
      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium
      - name: Screenshot comparator pixel-diff smoke
        run: npm run visual:test
      - name: Browser smoke tests
        run: npm run demo:test:e2e
      - name: Ensure Electron executable was downloaded
        run: |
          if [ ! -x node_modules/electron/dist/electron ]; then
            echo "Electron npm package has no binary; downloading with install.js"
            env -u ELECTRON_SKIP_BINARY_DOWNLOAD node node_modules/electron/install.js
          fi
          test -x node_modules/electron/dist/electron
      - name: Launch independent Electron desktop and verify preload
        run: xvfb-run -a -s "-screen 0 1600x900x24" npm run desktop:test:smoke
        env:
          CI: "true"
      - name: Upload Electron desktop screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconstructed-electron-desktop-smoke
          path: packages/codex-frontend-reconstruction/desktop/test-results/
          if-no-files-found: warn
      - name: Upload browser preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-style-demo-browser-preview
          path: packages/codex-frontend-reconstruction/demo/test-results/
          if-no-files-found: warn

  windows-electron-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/codex-frontend-reconstruction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install independent desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and bundle local Electron renderer
        run: npm run demo:build
      - name: Ensure Windows Electron executable was downloaded
        shell: pwsh
        run: |
          if (!(Test-Path "node_modules/electron/dist/electron.exe")) {
            Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD -ErrorAction SilentlyContinue
            node node_modules/electron/install.js
          }
          if (!(Test-Path "node_modules/electron/dist/electron.exe")) {
            throw "Electron Windows binary is missing"
          }
      - name: Validate Windows visual capture helper
        shell: powershell
        run: npm run visual:capture:windows -- -SelfTest
      - name: Real Windows Electron window, preload, IPC and native menu smoke
        run: npm run desktop:test:smoke
      - name: Upload Windows Electron screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconstructed-electron-windows-smoke
          path: packages/codex-frontend-reconstruction/desktop/test-results/
          if-no-files-found: warn
